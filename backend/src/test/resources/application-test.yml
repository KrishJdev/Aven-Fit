spring:
  datasource:
    url: jdbc:h2:mem:avenfit_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        # Quote SQL reserved words (e.g. personal_records."value") for H2
        auto_quote_keyword: true

  flyway:
    enabled: false

jwt:
  secret: test-secret-key-for-hs256-must-be-at-least-256-bits-long-0123456789abcdef
  access-token-expiration-ms: 900000       # 15 minutes
  refresh-token-expiration-ms: 2592000000  # 30 days

avenfit:
  google:
    tokeninfo-url: https://oauth2.googleapis.com/tokeninfo

logging:
  level:
    com.avenfit: INFO
    org.springframework.security: WARN
